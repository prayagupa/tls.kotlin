// Root build.gradle — delegates configuration to subprojects
// Run server:  ./gradlew runServer
// Run client:  ./gradlew runClient  (in a separate tab, after server is up)

buildscript {
    ext.kotlin_version = '2.1.21'
    repositories { mavenCentral() }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

subprojects {
    apply plugin: 'application'
    apply plugin: 'kotlin'

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    }
}

// ── Convenience tasks at root level ──────────────────────────────────────────
// Delegates to :server:run and :client:run within the same Gradle process,
// avoiding the file-lock conflict caused by GradleBuild spawning a child daemon.

task runServer {
    description = 'Start the TLS server (tab 1)'
    dependsOn ':server:run'
}

task runClient {
    description = 'Start the TLS client (tab 2, after server is up)'
    dependsOn ':client:run'
}

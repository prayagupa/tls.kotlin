buildscript {
    ext.kotlin_version = '2.1.21'
    ext.ktor_version   = '3.0.3'

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'application'
apply plugin: 'kotlin'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "ch.qos.logback:logback-classic:1.5.18"
    // Netty's JdkSslServerContext probes for BouncyCastle at static init time;
    // without it on the classpath the SSL context fails to initialise.
    implementation "org.bouncycastle:bcprov-jdk18on:1.80"
    implementation "org.bouncycastle:bctls-jdk18on:1.80"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.80"  // PEMParser lives here
}

application {
    mainClass = "server.api.Server"
}